<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>
  <!-- AI text -->
  <text x="10" y="38" font-family="Arial Black, sans-serif" font-weight="900" font-size="26" fill="white">AI</text>
  <!-- Star/sparkle -->
  <text x="38" y="26" font-family="Arial" font-size="20" fill="#fbbf24">✦</text>
  <!-- Bottom accent line -->
  <rect x="10" y="46" width="44" height="3" rx="1.5" fill="white" opacity="0.4"/>
</svg>
